<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreira DO-BR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #050914; --card: #0d1424; --card2: #141d33; --borda: #22304d;
    --texto: #eef2fb; --fraco: #8b98b8; --acento: #f5d90a; --ok: #3ddc84; --ruim: #ff5c6c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 500px at 50% -100px, #0f1d3d 0%, var(--bg) 60%); color: var(--texto);
         font-family: 'Barlow', system-ui, sans-serif; min-height: 100vh; }
  #app { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  h1, h2, h3, .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  h1 { font-size: 2.6rem; margin: 0; line-height: 1; }
  h1 span { color: var(--acento); }
  .fraco { color: var(--fraco); }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .btn { background: var(--acento); color: #111; border: 0; border-radius: 999px; padding: 12px 22px; font: 800 1.05rem 'Barlow Condensed', sans-serif;
         text-transform: uppercase; letter-spacing: .6px; cursor: pointer; }
  .btn.sec { background: transparent; color: var(--texto); border: 1px solid var(--borda); }
  .btn:disabled { opacity: .4; cursor: default; }
  .linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; gap: 10px; }
  label.campo { display: block; font-size: .75rem; color: var(--fraco); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; }
  input[type=text], input[type=number] { width: 100%; background: var(--card2); border: 1px solid var(--borda); color: var(--texto);
         border-radius: 10px; padding: 12px; font: 600 1rem 'Barlow', sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--card2); border: 1px solid var(--borda); color: var(--texto); border-radius: 999px; padding: 9px 16px; cursor: pointer;
          font: 700 .95rem 'Barlow Condensed', sans-serif; letter-spacing: .5px; }
  .chip.on { background: var(--acento); color: #111; border-color: var(--acento); }
  .camisa { display: flex; align-items: center; gap: 10px; }
  .camisa button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--borda); background: var(--card2); color: var(--texto); font-size: 1.2rem; cursor: pointer; }
  .camisa b { font: 800 2rem 'Barlow Condensed', sans-serif; min-width: 48px; text-align: center; }
  .escudo { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
  .escudo.gerado { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font: 800 1rem 'Barlow Condensed'; color: #fff; }
  .topo { display: flex; gap: 14px; align-items: center; }
  .topo .num { font: 800 3rem 'Barlow Condensed'; color: var(--acento); line-height: 1; }
  .topo .nome { font: 800 1.7rem 'Barlow Condensed'; text-transform: uppercase; line-height: 1.05; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card2); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font: 800 1.4rem 'Barlow Condensed'; }
  .stat small { color: var(--fraco); font-size: .68rem; letter-spacing: 1px; text-transform: uppercase; }
  .ovr b { color: var(--acento); font-size: 2rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th { color: var(--fraco); font: 700 .72rem 'Barlow Condensed'; text-transform: uppercase; letter-spacing: 1px; text-align: left; padding: 6px 4px; }
  td { padding: 7px 4px; border-top: 1px solid var(--borda); }
  td.c { text-align: center; } th.c { text-align: center; }
  tr.atual td { color: var(--acento); font-weight: 700; }
  .oferta { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--borda); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .oferta .info { flex: 1; min-width: 0; }
  .oferta .info b { font: 800 1.25rem 'Barlow Condensed'; text-transform: uppercase; display: block; }
  .tit { font: 700 .8rem 'Barlow Condensed'; letter-spacing: 1px; color: var(--fraco); text-transform: uppercase; }
  .tit em { font-style: normal; color: var(--ok); }
  .tit em.baixa { color: var(--ruim); } .tit em.media { color: var(--acento); }
  .opcao { display: block; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--borda); border-radius: 12px; color: var(--texto);
           padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .opcao:hover { border-color: var(--acento); }
  .opcao b { font: 800 1.15rem 'Barlow Condensed'; text-transform: uppercase; }
  .opcao small { display: block; color: var(--fraco); margin: 2px 0 8px; }
  .prob { display: flex; gap: 8px; flex-wrap: wrap; }
  .prob span { font: 700 .8rem 'Barlow Condensed'; letter-spacing: .5px; padding: 3px 9px; border-radius: 999px; background: #0a1226; border: 1px solid var(--borda); }
  .prob span.pos { color: var(--ok); } .prob span.neg { color: var(--ruim); }
  .escolha-n { color: var(--acento); font: 700 .8rem 'Barlow Condensed'; letter-spacing: 1.5px; }
  .resultado-msg { border-left: 3px solid var(--acento); padding: 8px 12px; background: var(--card2); border-radius: 0 10px 10px 0; margin: 10px 0; }
  .tag-pos { color: var(--ok); } .tag-neg { color: var(--ruim); }
  @media (max-width: 480px) { h1 { font-size: 2.1rem; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ============================================================================
// Dados e constantes
// ============================================================================
const ASSET = "https://cdn.jsdelivr.net/gh/doc2342/7a0-DOBR-assets@main/";
const CHAVE_SAVE = "carreira_dobr_v1";
const POSICOES = ["CA", "PE", "PD", "MEI", "ME", "MD", "MC", "VOL", "LE", "LD", "ZAG"];
const PESO_GOL = { CA: 1, PE: .6, PD: .6, MEI: .5, ME: .35, MD: .35, MC: .25, VOL: .1, LE: .08, LD: .08, ZAG: .06 };
const PESO_ASS = { CA: .4, PE: .8, PD: .8, MEI: 1, ME: .7, MD: .7, MC: .5, VOL: .25, LE: .45, LD: .45, ZAG: .05 };
const BASE_TIER = { 1: 52, 2: 66, 3: 80 };
const DELTA_IDADE = { 16: 5, 17: 4.5, 18: 4, 19: 3.5, 20: 3, 21: 2.5, 22: 2, 23: 1.5, 24: 1, 25: .5, 26: 0, 27: -.3, 28: -.6, 29: -1, 30: -1.4, 31: -1.8, 32: -2.2 };
const IDADE_MAX = 38;

let CLUBES = [];
let G = null;           // estado da carreira
const $app = document.getElementById("app");

// ============================================================================
// Utilidades
// ============================================================================
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randn = () => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return (u - 3) / 0.7071; };
const embaralhar = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clubePorId = id => CLUBES.find(c => c.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtValor(v) {
  if (v >= 1e6) return "R$ " + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".", ",") + "M";
  return "R$ " + Math.round(v / 1e3) + "K";
}

const B1_ORIGEM = ["C1", "C2", "C3", "C4"], B2_ORIGEM = ["C5", "C6", "C7", "C8"];
const GRUPOS = ["CB", "B1", "B2", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8"];
const tierDoGrupo = g => g === "CB" ? 3 : g[0] === "B" ? 2 : 1;
const rotuloGrupo = g => g === "CB" ? "Brasileirão" : "Série " + g;
const paraGrupo = g => (g === "CB" ? "o " : "a ") + rotuloGrupo(g);
function aplicarGrupos() { // grupo de cada clube = original + acessos/rebaixamentos desta carreira
  CLUBES.forEach(c => {
    if (c.grupo0 === undefined) c.grupo0 = c.grupo;
    c.grupo = (G && G.grupos && G.grupos[c.id]) || c.grupo0;
    c.tier = tierDoGrupo(c.grupo); c.liga = rotuloGrupo(c.grupo);
  });
}
function moverGrupo(c, g) {
  G.grupos = G.grupos || {};
  G.grupos[c.id] = g; c.grupo = g; c.tier = tierDoGrupo(g); c.liga = rotuloGrupo(g);
}

function forcaClube(c) { // 0.4 do OVR-escala do clube pelos dados + base do tier
  const media = (c.GK + c.DF + c.MF + c.FW) / 4;
  const off = clamp((media - 90) * 0.5, -4, 4);
  return BASE_TIER[c.tier] + off + (c._fx || 0);
}

function escudoHTML(c, tam) {
  const ini = c.nome.replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  let h = 0; for (const ch of c.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const gerado = `<span class="escudo gerado" style="width:${tam}px;height:${tam}px;background:hsl(${h % 360},55%,38%)">${ini}</span>`;
  return `<img class="escudo" style="width:${tam}px;height:${tam}px" src="${ASSET}crests/${c.id}.png" alt="" onerror="this.outerHTML=decodeURIComponent('${encodeURIComponent(gerado)}')">`;
}

// ============================================================================
// Modelo do jogo
// ============================================================================
function titularidade(ovr, clube, espaco) {
  return Math.round(clamp(50 + (ovr - forcaClube(clube)) * 4.2 + (espaco - 50) * 0.5, 1, 96));
}

function valorMercado(ovr, idade) {
  const f = idade <= 20 ? 1.3 : idade <= 24 ? 1.15 : idade <= 28 ? 1 : idade <= 31 ? .7 : .4;
  return 100000 * Math.exp((ovr - 52) * 0.13) * f;
}

function classeTit(t) { return t >= 60 ? "" : t >= 25 ? "media" : "baixa"; }

function novaCarreira(dados) {
  G = { grupos: {},
    ...dados, ovr: 52, potencial: rndInt(72, 92), idade: 16, clubeId: null, espaco: 50,
    titulos: 0, selJogos: 0, selConv: false, hist: [], fase: "oferta_base", eventos: [], evIdx: 0,
    fx: { jogosMult: 1, ofertas: 0 }, log: [], ofertas: []
  };
  aplicarGrupos();
}

function salvar() { try { localStorage.setItem(CHAVE_SAVE, JSON.stringify(G)); } catch (e) {} }
function carregarSave() { try { return JSON.parse(localStorage.getItem(CHAVE_SAVE)); } catch (e) { return null; } }

// ----------------------------------------------------------------------------
// Eventos de escolha: cada opção tem resultados com probabilidade. fx:
//   espaco (+/-), ovr (+/-), valor (% sobre o valor atual, guardado em valorMult), jogosMult, ofertas
// ----------------------------------------------------------------------------
const EVENTOS = [
  { id: "treinador", titulo: "Discussão com o treinador", texto: "Você teve uma discussão com o treinador depois de ser substituído.",
    ops: [
      { t: "Quero me posicionar", sub: "Ganha respeito e espaço", res: [{ p: 60, tag: "MAIS ESPAÇO", fx: { espaco: 12 }, msg: "O treinador gostou da postura e passou a te dar mais moral." }, { p: 40, tag: "MENOS ESPAÇO", fx: { espaco: -12 }, msg: "O treinador não gostou nada e te deixou de lado." }] },
      { t: "Deixar passar", sub: "A relação continua como está", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você engoliu o orgulho. Nada muda." }] } ] },
  { id: "patrocinio", titulo: "Proposta de patrocinador", texto: "Uma marca esportiva quer te contratar como garoto-propaganda.",
    ops: [
      { t: "Aceitar o contrato", sub: "Mais exposição, mais foco fora de campo", res: [{ p: 70, tag: "+ VALOR", fx: { valor: 8 }, msg: "A imagem cresceu e o valor de mercado acompanhou." }, { p: 30, tag: "DISTRAÇÃO", fx: { ovr: -0.6 }, msg: "As gravações atrapalharam a rotina de treinos." }] },
      { t: "Recusar", sub: "Foco total no campo", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você seguiu focado nos treinos." }] } ] },
  { id: "treino_extra", titulo: "Treino extra", texto: "Um preparador físico oferece um plano de treinos individual puxado.",
    ops: [
      { t: "Topar o plano", sub: "Pode evoluir mais — ou se machucar", res: [{ p: 65, tag: "+ OVR", fx: { ovr: 1 }, msg: "Você sentiu a evolução logo nas primeiras semanas." }, { p: 35, tag: "LESÃO LEVE", fx: { ovr: -0.3, espaco: -8 }, msg: "O corpo não aguentou a carga e você perdeu jogos." }] },
      { t: "Só o treino normal", sub: "Sem riscos", res: [{ p: 100, tag: "+ OVR PEQUENO", fx: { ovr: 0.2 }, msg: "Rotina normal, evolução tranquila." }] } ] },
  { id: "imprensa", titulo: "Repórter provoca", texto: "Depois do jogo, um repórter tenta te tirar do sério com uma pergunta polêmica.",
    ops: [
      { t: "Responder à altura", sub: "A torcida gosta de personalidade", res: [{ p: 50, tag: "+ VALOR", fx: { valor: 6 }, msg: "A resposta viralizou e a torcida abraçou você." }, { p: 50, tag: "- VALOR", fx: { valor: -6 }, msg: "A frase foi mal interpretada e virou crítica." }] },
      { t: "Ficar em silêncio", sub: "Não dar assunto", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você saiu de fininho e o assunto morreu." }] } ] },
  { id: "mentor", titulo: "Conselho de um veterano", texto: "Um jogador experiente se oferece para te ajudar no dia a dia.", maxIdade: 21,
    ops: [
      { t: "Pedir conselhos", sub: "Aprender com quem já viveu tudo", res: [{ p: 80, tag: "+ OVR", fx: { ovr: 0.8 }, msg: "Você absorveu detalhes que os treinos não ensinam." }, { p: 20, tag: "NADA MUDA", fx: {}, msg: "Ele estava mais a fim de falar do que de ensinar." }] },
      { t: "Seguir sozinho", sub: "Seu jeito, seu ritmo", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você preferiu seguir o próprio caminho." }] } ] },
  { id: "balada", titulo: "Convite pra balada", texto: "Os companheiros te chamam para sair na véspera de folga.", minIdade: 18,
    ops: [
      { t: "Ir com a galera", sub: "Bom pro clima, mas tem risco", res: [{ p: 40, tag: "MENOS ESPAÇO", fx: { espaco: -10 }, msg: "Alguém postou foto e o treinador ficou sabendo." }, { p: 60, tag: "NADA MUDA", fx: {}, msg: "Foi só diversão e ninguém ficou sabendo." }] },
      { t: "Ficar em casa", sub: "Descansar e se cuidar", res: [{ p: 100, tag: "+ OVR PEQUENO", fx: { ovr: 0.2 }, msg: "Você acordou inteiro para o treino." }] } ] },
  { id: "tecnico_novo", titulo: "Técnico novo", texto: "O clube trocou de comando e o novo treinador está avaliando o elenco.",
    ops: [
      { t: "Mostrar serviço", sub: "Se destacar nos treinos", res: [{ p: 55, tag: "MAIS ESPAÇO", fx: { espaco: 12 }, msg: "Você chamou a atenção do professor logo de cara." }, { p: 45, tag: "MENOS ESPAÇO", fx: { espaco: -6 }, msg: "Você se afobou e errou demais." }] },
      { t: "Manter a discrição", sub: "Deixar o tempo trabalhar", res: [{ p: 100, tag: "+ ESPAÇO PEQUENO", fx: { espaco: 2 }, msg: "Você foi ganhando confiança aos poucos." }] } ] },
  { id: "viral", titulo: "Lance viral", texto: "Um lance seu virou meme nas redes sociais.",
    ops: [
      { t: "Entrar na brincadeira", sub: "Postar e aproveitar a onda", res: [{ p: 60, tag: "+ VALOR", fx: { valor: 10 }, msg: "Milhões de visualizações e uma imagem mais forte." }, { p: 40, tag: "- VALOR", fx: { valor: -6, espaco: -3 }, msg: "O clube achou que você estava levando tudo na brincadeira." }] },
      { t: "Ignorar", sub: "Não dar bola", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "O assunto passou rápido." }] } ] },
  { id: "lesao", titulo: "Lesão séria", texto: "Você sentiu o joelho em um treino e o departamento médico foi chamado.", minIdade: 21, raro: true,
    ops: [
      { t: "Cirurgia agora", sub: "Parar já, voltar mais forte", res: [{ p: 100, tag: "MENOS JOGOS", fx: { jogosMult: 0.5, ovr: -0.4 }, msg: "Você passou boa parte da temporada no departamento médico." }] },
      { t: "Tratamento conservador", sub: "Tentar seguir jogando", res: [{ p: 60, tag: "QUASE NADA", fx: { ovr: -0.2, jogosMult: 0.85 }, msg: "A dor deu trégua e você seguiu em campo." }, { p: 40, tag: "PIORA", fx: { ovr: -1.4, jogosMult: 0.6 }, msg: "A lesão piorou e a recuperação foi longa." }] } ] },
  { id: "empresario", titulo: "Troca de empresário", texto: "Um agente conhecido no mercado quer representar você.",
    ops: [
      { t: "Trocar de empresário", sub: "Pode abrir portas — ou fechar", res: [{ p: 55, tag: "+ OFERTAS", fx: { ofertas: 1 }, msg: "O novo agente vive ligando para clubes por aí." }, { p: 45, tag: "- OFERTAS", fx: { ofertas: -1 }, msg: "O antigo agente ficou magoado e cortou contatos." }] },
      { t: "Manter o atual", sub: "Quem tá comigo, fica", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Nada muda com o empresário." }] } ] },
  { id: "capitao", titulo: "Braçadeira de capitão", texto: "O treinador te oferece a braçadeira de capitão.", minIdade: 24,
    ops: [
      { t: "Assumir a braçadeira", sub: "Mais responsabilidade", res: [{ p: 60, tag: "MAIS ESPAÇO", fx: { espaco: 8, ovr: 0.3 }, msg: "O vestiário abraçou a liderança." }, { p: 40, tag: "PRESSÃO", fx: { ovr: -0.4 }, msg: "A pressão pesou e o desempenho caiu." }] },
      { t: "Recusar", sub: "Deixar pra outro", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você declinou o convite com educação." }] } ] },
  { id: "posicao", titulo: "Mudança de função", texto: "O treinador quer te testar em uma função tática diferente.",
    ops: [
      { t: "Topar o desafio", sub: "Aprender algo novo", res: [{ p: 50, tag: "+ OVR", fx: { ovr: 0.7 }, msg: "A nova função revelou qualidades que você não conhecia." }, { p: 50, tag: "MENOS ESPAÇO", fx: { espaco: -8 }, msg: "Você não se achou na função e perdeu espaço." }] },
      { t: "Preferir sua posição", sub: "Segurança", res: [{ p: 100, tag: "NADA MUDA", fx: {}, msg: "Você seguiu no papel de sempre." }] } ] },
];

function sortearEventos() {
  const base = EVENTOS.filter(e => (!e.minIdade || G.idade >= e.minIdade) && (!e.maxIdade || G.idade <= e.maxIdade) && (!e.raro || Math.random() < 0.25));
  return embaralhar(base).slice(0, 2);
}

function aplicarFx(fx) {
  if (fx.espaco) G.espaco = clamp(G.espaco + fx.espaco, 0, 100);
  if (fx.ovr) G.ovr = clamp(G.ovr + fx.ovr, 30, 99);
  if (fx.valor) G.valorMult = (G.valorMult || 1) * (1 + fx.valor / 100);
  if (fx.jogosMult) G.fx.jogosMult *= fx.jogosMult;
  if (fx.ofertas) G.fx.ofertas += fx.ofertas;
}

// ----------------------------------------------------------------------------
// Temporada
// ----------------------------------------------------------------------------
// classificação de cada divisão: força do clube + sorte (o jogador pesa no time dele)
function tabelaGrupo(g, bonusJogador) {
  return CLUBES.filter(c => c.grupo === g)
    .map(c => ({ id: c.id, sc: forcaClube(c) + randn() * 3.6 + (c.id === G.clubeId ? bonusJogador : 0) }))
    .sort((a, b) => b.sc - a.sc).map(x => x.id);
}

// Regras (mesmas do Fenômeno): campeão de cada C sobe (C1-C4 -> B1, C5-C8 -> B2);
// campeão de B1 e de B2 sobem pro CB; vices de B1 x B2 fazem playoff por mais 1 vaga no CB;
// caem 3 do CB e 4 de cada B (cada rebaixado da B volta pra um grupo C de origem).
function aplicarTransicoes(tab) {
  const novo = {}; const mover = (id, g) => { novo[id] = g; };
  B1_ORIGEM.forEach(g => mover(tab[g][0], "B1"));
  B2_ORIGEM.forEach(g => mover(tab[g][0], "B2"));
  mover(tab.B1[0], "CB"); mover(tab.B2[0], "CB");
  const vB1 = tab.B1[1], vB2 = tab.B2[1];
  const dif = forcaClube(clubePorId(vB1)) - forcaClube(clubePorId(vB2));
  const venceuB1 = Math.random() < 1 / (1 + Math.exp(-dif / 4));
  const vencedor = venceuB1 ? vB1 : vB2;
  const divVenc = venceuB1 ? "B1" : "B2", divPerd = venceuB1 ? "B2" : "B1";
  mover(vencedor, "CB");
  const rebCB = embaralhar(tab.CB.slice(-3));
  mover(rebCB[0], divVenc); mover(rebCB[1], divVenc); mover(rebCB[2], divPerd);
  const rebB1 = embaralhar(tab.B1.slice(-4)); B1_ORIGEM.forEach((g, i) => mover(rebB1[i], g));
  const rebB2 = embaralhar(tab.B2.slice(-4)); B2_ORIGEM.forEach((g, i) => mover(rebB2[i], g));
  return { novo, playoff: { vB1, vB2, vencedor } };
}

function simularTemporada() {
  const clube = clubePorId(G.clubeId);
  const S = forcaClube(clube);
  const grupoAntes = clube.grupo, tierAntes = clube.tier;
  const tit = titularidade(G.ovr, clube, G.espaco);
  const jogosTot = 26;
  const jogos = clamp(Math.round(jogosTot * (tit / 100) * rnd(0.85, 1.05) * G.fx.jogosMult), 0, jogosTot);

  const intensidade = Math.exp((G.ovr - 75) / 14) * (S / 80);
  const gols = Math.max(0, Math.round(jogos * PESO_GOL[G.pos] * 0.85 * intensidade * rnd(0.6, 1.4)));
  const ass = Math.max(0, Math.round(jogos * PESO_ASS[G.pos] * 0.55 * intensidade * rnd(0.6, 1.4)));
  const nota = jogos ? clamp(6.2 + (G.ovr - S) * 0.06 + (Math.random() - 0.5) * 0.8, 5, 9.2) : 0;

  // competição internacional (só vale se ainda estiver no clube que se classificou)
  let intlRes = null;
  const qual = G.intlQual;
  if (qual && qual.clubeId === G.clubeId) {
    const base = qual.tipo === "CHAMPIONS" ? 0.10 : 0.12;
    const campeao = Math.random() < base + clamp((G.ovr - S) * 0.004, -0.03, 0.05);
    intlRes = { tipo: qual.tipo, campeao, fase: campeao ? "Campeão" : pick(["Fase de grupos", "Oitavas", "Quartas", "Semifinal", "Final"]) };
    if (campeao) { G.titulos++; G.titulosIntl = (G.titulosIntl || 0) + 1; }
  }
  G.intlQual = null;

  // todas as divisões da pirâmide jogam, e depois vêm acessos/rebaixamentos
  const bonus = (G.ovr - S) * 0.3 * (jogos / jogosTot);
  const tab = {}; GRUPOS.forEach(g => { tab[g] = tabelaGrupo(g, bonus); });
  const pos = tab[grupoAntes].indexOf(G.clubeId) + 1;
  const titulo = pos === 1;
  if (titulo) G.titulos++;
  if (grupoAntes === "CB" && pos <= 2) G.intlQual = { clubeId: G.clubeId, tipo: pos === 1 ? "CHAMPIONS" : "CHALLENGE" };

  const { novo, playoff } = aplicarTransicoes(tab);
  let playoffInfo = null;
  if (G.clubeId === playoff.vB1 || G.clubeId === playoff.vB2) {
    const advId = G.clubeId === playoff.vB1 ? playoff.vB2 : playoff.vB1;
    playoffInfo = { adv: clubePorId(advId).nome, venceu: playoff.vencedor === G.clubeId };
  }
  Object.entries(novo).forEach(([id, g]) => { const c = clubePorId(id); if (c.grupo !== g) moverGrupo(c, g); });
  const tierDepois = clube.tier;
  const mov = tierDepois > tierAntes ? "A" : tierDepois < tierAntes ? "R" : null;

  // seleção
  let selNovos = 0;
  if (G.idade >= 19 && Math.random() < clamp((G.ovr - 78) / 12, 0, 0.9)) { selNovos = rndInt(2, 9); G.selJogos += selNovos; G.selConv = true; }

  // valor e evolução
  const ovrAntes = G.ovr;
  const idadeCurva = DELTA_IDADE[Math.min(G.idade, 32)] ?? -2.6;
  let delta = idadeCurva + (jogos / jogosTot - 0.5) * 1.5 + randn() * 0.5;
  if (delta > 0) delta *= clamp((G.potencial - G.ovr) / 6 + 0.25, 0, 1.2);
  G.ovr = clamp(G.ovr + delta, 30, 99);
  G.espaco = clamp(G.espaco + (nota >= 7 ? 5 : nota < 6 ? -5 : 0) + (50 - G.espaco) * 0.15, 0, 100);

  const row = { idade: G.idade, clubeId: G.clubeId, ovr: Math.round(ovrAntes), jogos, gols, ass, nota, pos, titulo, selNovos, tier: tierAntes, mov,
    ligaAntes: rotuloGrupo(grupoAntes), grupoAntes, grupoDepois: clube.grupo, playoff: playoffInfo, intlRes, intlNova: G.intlQual ? G.intlQual.tipo : null };
  G.hist.push(row);
  G.ultimoRes = { ...row, tit, delta: G.ovr - ovrAntes, ovrDepois: Math.round(G.ovr), valor: valorMercadoAtual() };
  G.fx = { jogosMult: 1, ofertas: G.fx.ofertas };
  G.fase = "resultado";
}

function valorMercadoAtual() { return valorMercado(G.ovr, G.idade) * (G.valorMult || 1); }

function gerarOfertas(qtdMin) {
  const atual = G.clubeId;
  const alvo = Math.max(1, Math.min(4, qtdMin + (G.fx.ofertas > 0 ? 1 : 0) - (G.fx.ofertas < 0 ? 1 : 0)));
  const cands = embaralhar(CLUBES.filter(c => c.id !== atual && Math.abs(forcaClube(c) - G.ovr) < 16));
  const ofs = cands.slice(0, 9).map(c => ({ id: c.id, tit: titularidade(G.ovr, c, 50) }));
  const sorted = ofs.sort((a, b) => forcaClube(clubePorId(b.id)) - forcaClube(clubePorId(a.id)));
  const sel = [];
  const sobe = sorted.find(o => forcaClube(clubePorId(o.id)) > forcaClube(clubePorId(atual)) + 2);
  const seguro = sorted.filter(o => o.tit >= 60)[0];
  [sobe, seguro, ...sorted].forEach(o => { if (o && !sel.some(x => x.id === o.id) && sel.length < alvo) sel.push(o); });
  G.fx.ofertas = 0;
  G.ofertas = sel;
}

function ofertasBase() {
  const porTier = t => pick(CLUBES.filter(c => c.tier === t));
  return [1, 2, 3].map(t => { const c = porTier(t); return { id: c.id, tit: titularidade(G.ovr, c, 50) }; });
}

function assinar(id) {
  G.clubeId = id; G.espaco = 50; G.ofertas = [];
  if (G.fase === "oferta_base") { G.fase = "evento"; } else { G.idade++; G.fase = "evento"; }
  G.eventos = sortearEventos(); G.evIdx = 0; G.msgEv = null;
  salvar(); render();
}

function continuarNoClube() { assinar(G.clubeId); }

function proximo() {
  if (G.fase === "resultado") {
    if (G.idade >= IDADE_MAX || (G.idade >= 34 && G.ovr < 60)) { G.fase = "fim"; salvar(); render(); return; }
    gerarOfertas(G.idade >= 30 ? 1 : 2);
    G.fase = "ofertas";
  }
  salvar(); render();
}

function escolher(i) {
  const ev = G.eventos[G.evIdx], op = ev.ops[i];
  let r = Math.random() * 100, out = op.res[op.res.length - 1];
  for (const o of op.res) { if (r < o.p) { out = o; break; } r -= o.p; }
  aplicarFx(out.fx);
  G.msgEv = { tag: out.tag, msg: out.msg, bom: out.tag.includes("+") || out.tag.startsWith("MAIS"), neutro: out.tag === "NADA MUDA" };
  salvar(); render();
}

function avancarEvento() {
  G.msgEv = null; G.evIdx++;
  if (G.evIdx >= G.eventos.length) simularTemporada();
  salvar(); render();
}

function aposentar() { G.fase = "fim"; salvar(); render(); }

    $app.innerHTML = cabecalho() + corpo + tabelaHist(); return;

  if (G.fase === "ofertas") {
    const atual = clubePorId(G.clubeId);
    corpo = `<div class="card"><h2 style="margin-top:0">Mercado da bola</h2><p class="fraco">Você tem contrato com o ${esc(atual.nome)} — fique ou aceite uma nova proposta.</p>
      <div class="oferta">${escudoHTML(atual, 48)}<div class="info"><b>${esc(atual.nome)}</b><span class="fraco">${atual.liga}</span><br><span class="tit">Titularidade <em class="${classeTit(titularidade(G.ovr, atual, G.espaco))}">${titularidade(G.ovr, atual, G.espaco)}%</em></span></div>
        <button class="btn sec" onclick="continuarNoClube()">Ficar</button></div>
      ${G.ofertas.map(o => cardOferta(o, "Assinar")).join("")}
      ${G.idade >= 33 ? `<button class="btn sec" style="margin-top:8px" onclick="aposentar()">Pendurar as chuteiras</button>` : ""}</div>`;
    $app.innerHTML = cabecalho() + corpo + tabelaHist(); return;
  }
  if (G.fase === "fim") {
    const totJ = G.hist.reduce((s, h) => s + h.jogos, 0), totG = G.hist.reduce((s, h) => s + h.gols, 0), totA = G.hist.reduce((s, h) => s + h.ass, 0);
    const pico = Math.max(...G.hist.map(h => h.ovr));
    corpo = `<div class="card"><div class="escolha-n">FIM DE CARREIRA</div><h2 style="margin:4px 0 8px">${esc(G.nome)} pendurou as chuteiras</h2>
      <div class="stats"><div class="stat"><b>${totJ}</b><small>Jogos</small></div><div class="stat"><b>${totG}</b><small>Gols</small></div>
        <div class="stat"><b>${totA}</b><small>Assist.</small></div><div class="stat"><b>${G.titulos}</b><small>Títulos</small></div></div>
      <div class="resultado-msg">Pico de OVR: <b>${pico}</b> · Clubes: ${new Set(G.hist.map(h => h.clubeId)).size} · Seleção: ${G.selJogos} jogos</div>
      <button class="btn" onclick="localStorage.removeItem(CHAVE_SAVE);G=null;render()">Nova carreira</button></div>`;
    $app.innerHTML = cabecalho() + corpo + tabelaHist(); return;
  }
